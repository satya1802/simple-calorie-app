# Generated by QuorQ AI SDLC from the approved architecture. This file is overwritten on every publish; edit the architecture instead.
openapi: 3.1.0
info:
  title: Simple calorie app
  version: architecture-v1
  description: Designed API from the approved architecture (not extracted from code).
paths:
  /account:
    delete:
      summary: Self-service delete after explicit confirmation; cascading removal,
        sessions ended, seeded catalogue retained.
      description: Self-service delete after explicit confirmation; cascading removal,
        sessions ended, seeded catalogue retained.
      operationId: delete_account
      parameters: []
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /account/export:
    post:
      summary: Produce a machine-readable export of all the user's own data.
      description: Produce a machine-readable export of all the user's own data.
      operationId: post_account_export
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{}'
      responses:
        '200':
          description: '{file or being-prepared message}'
      security:
      - bearerAuth: []
  /auth/forgot-password:
    post:
      summary: Request reset; identical response whether or not the address exists.
      description: Request reset; identical response whether or not the address exists.
      operationId: post_auth_forgot_password
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email}'
      responses:
        '200':
          description: '{message: same confirmation always}'
  /auth/google/callback:
    get:
      summary: Handle Google return; create or match account by email, prompt consent
        for first-time users, no account on deny.
      description: Handle Google return; create or match account by email, prompt
        consent for first-time users, no account on deny.
      operationId: get_auth_google_callback
      parameters: []
      responses:
        '200':
          description: '{session, next: ''consent|body-details|today''}'
  /auth/google/start:
    get:
      summary: Begin Google OAuth; redirect to Google consent.
      description: Begin Google OAuth; redirect to Google consent.
      operationId: get_auth_google_start
      parameters: []
      responses:
        '200':
          description: 302 redirect
  /auth/login:
    post:
      summary: Sign in with email and password; generic failure message.
      description: Sign in with email and password; generic failure message.
      operationId: post_auth_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email, password}'
      responses:
        '200':
          description: '{session} or generic ''email or password is incorrect'''
  /auth/logout:
    post:
      summary: End the current session.
      description: End the current session.
      operationId: post_auth_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{}'
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /auth/reset-password:
    post:
      summary: Set new password from valid token; invalidate all sessions.
      description: Set new password from valid token; invalidate all sessions.
      operationId: post_auth_reset_password
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{token, password}'
      responses:
        '200':
          description: '{reset: true} or invalid link'
  /auth/signup:
    post:
      summary: Create email/password account with required consent, start session,
        trigger verification email.
      description: Create email/password account with required consent, start session,
        trigger verification email.
      operationId: post_auth_signup
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email, password, consent: {accepted, version}}'
      responses:
        '200':
          description: '{user, session} or field errors / already-registered'
  /auth/verify-email:
    post:
      summary: Consume single-use verification token.
      description: Consume single-use verification token.
      operationId: post_auth_verify_email
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{token}'
      responses:
        '200':
          description: '{verified} or ''link no longer valid'''
  /body-details:
    post:
      summary: Save validated body details and compute/persist the dated calorie target.
      description: Save validated body details and compute/persist the dated calorie
        target.
      operationId: post_body_details
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{height, weight, age, sex, activity_level, target_weight,
                units}'
      responses:
        '200':
          description: '{body_details, target, disclaimer} or field errors / extreme
            refusal'
      security:
      - bearerAuth: []
    put:
      summary: Update body details; recalculate target subject to floor, preserve
        a manual target with a prompt.
      description: Update body details; recalculate target subject to floor, preserve
        a manual target with a prompt.
      operationId: put_body_details
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{...fields}'
      responses:
        '200':
          description: '{body_details, target}'
      security:
      - bearerAuth: []
  /consent:
    post:
      summary: Record consent (wording version and timestamp) for Google first-time
        users before data storage.
      description: Record consent (wording version and timestamp) for Google first-time
        users before data storage.
      operationId: post_consent
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{version}'
      responses:
        '200':
          description: '{consent}'
      security:
      - bearerAuth: []
  /entries:
    post:
      summary: Add entry to a meal and date; returns updated totals.
      description: Add entry to a meal and date; returns updated totals.
      operationId: post_entries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{date, meal, food_id?, custom_name?, portion_label, quantity,
                calories}'
      responses:
        '200':
          description: '{entry, totals}'
      security:
      - bearerAuth: []
  /entries/recent:
    get:
      summary: Short list of the user's recently logged foods/portions for one-tap
        re-log.
      description: Short list of the user's recently logged foods/portions for one-tap
        re-log.
      operationId: get_entries_recent
      parameters: []
      responses:
        '200':
          description: '{items[]}'
      security:
      - bearerAuth: []
  /entries/{id}:
    put:
      summary: Edit portion, calories or meal; move section and recalc; own entries
        only.
      description: Edit portion, calories or meal; move section and recalc; own entries
        only.
      operationId: put_entries_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{portion_label?, quantity?, calories?, meal?}'
      responses:
        '200':
          description: '{entry, totals} or 404'
      security:
      - bearerAuth: []
    delete:
      summary: Delete own entry after confirmation; recalc totals.
      description: Delete own entry after confirmation; recalc totals.
      operationId: delete_entries_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{totals} or 404'
      security:
      - bearerAuth: []
  /estimate:
    post:
      summary: Send only the user's description to OpenAI; return editable breakdown
        (unsaved) or a calm unavailable message.
      description: Send only the user's description to OpenAI; return editable breakdown
        (unsaved) or a calm unavailable message.
      operationId: post_estimate
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{description}'
      responses:
        '200':
          description: '{lines[], total, label: estimate} or {unavailable, options}'
      security:
      - bearerAuth: []
  /foods/custom:
    post:
      summary: Create a private custom food (name, portion, calories); validated.
      description: Create a private custom food (name, portion, calories); validated.
      operationId: post_foods_custom
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name, portion_label, calories}'
      responses:
        '200':
          description: '{food} or field errors'
      security:
      - bearerAuth: []
  /foods/custom/{id}:
    put:
      summary: Edit own custom food; past entries keep recorded figures.
      description: Edit own custom food; past entries keep recorded figures.
      operationId: put_foods_custom_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{...fields}'
      responses:
        '200':
          description: '{food}'
      security:
      - bearerAuth: []
    delete:
      summary: Delete own custom food; logged entries stay intact.
      description: Delete own custom food; logged entries stay intact.
      operationId: delete_foods_custom_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /foods/search:
    get:
      summary: Typo-tolerant search from two characters across seed and own custom
        foods, ranked, each with default portion and calorie
      description: Typo-tolerant search from two characters across seed and own custom
        foods, ranked, each with default portion and calories.
      operationId: get_foods_search
      parameters: []
      responses:
        '200':
          description: '{results[]}'
      security:
      - bearerAuth: []
  /foods/{id}:
    get:
      summary: Food detail with portions and USDA attribution where applicable.
      description: Food detail with portions and USDA attribution where applicable.
      operationId: get_foods_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '{food, portions, attribution}'
      security:
      - bearerAuth: []
  /history:
    get:
      summary: 'Recent days: date, consumed, applied target, under/over; empty days
        shown as no entries.'
      description: 'Recent days: date, consumed, applied target, under/over; empty
        days shown as no entries.'
      operationId: get_history
      parameters: []
      responses:
        '200':
          description: '{rows[]}'
      security:
      - bearerAuth: []
  /log:
    get:
      summary: A day's log grouped by meal with subtotals, consumed, that day's target
        and remaining.
      description: A day's log grouped by meal with subtotals, consumed, that day's
        target and remaining.
      operationId: get_log
      parameters: []
      responses:
        '200':
          description: '{date, meals[], consumed, target, remaining}'
      security:
      - bearerAuth: []
  /privacy/consent:
    get:
      summary: User's consent date, wording version and links to export/delete.
      description: User's consent date, wording version and links to export/delete.
      operationId: get_privacy_consent
      parameters: []
      responses:
        '200':
          description: '{given_at, version}'
      security:
      - bearerAuth: []
  /target:
    get:
      summary: Current target with source (calculated|manual) and whether floored.
      description: Current target with source (calculated|manual) and whether floored.
      operationId: get_target
      parameters: []
      responses:
        '200':
          description: '{value, source, floored}'
      security:
      - bearerAuth: []
    put:
      summary: Set manual override (refused below floor/extreme) or revert to calculated.
      description: Set manual override (refused below floor/extreme) or revert to
        calculated.
      operationId: put_target
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{mode: ''manual''|''calculated'', value?}'
      responses:
        '200':
          description: '{target} or refusal with explanation'
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        email_verified:
          type: boolean
        google_sub:
          type: string
        consent_version:
          type: string
        consent_given_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - email_verified
      - created_at
    body_details:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        height_cm:
          type: number
        weight_kg:
          type: number
        age:
          type: integer
        sex:
          type: string
        activity_level:
          type: string
        target_weight_kg:
          type: number
        unit_preference:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - height_cm
      - weight_kg
      - age
      - sex
      - activity_level
      - target_weight_kg
      - unit_preference
      - updated_at
    calorie_targets:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        value_kcal:
          type: integer
        source:
          type: string
        calculated_value_kcal:
          type: integer
        floored:
          type: boolean
        effective_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - value_kcal
      - source
      - floored
      - effective_date
      - created_at
    foods:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        owner_user_id:
          type: string
          format: uuid
        name:
          type: string
        fdc_id:
          type: string
        attribution:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - source
      - name
      - created_at
    food_portions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        food_id:
          type: string
          format: uuid
        label:
          type: string
        grams:
          type: number
        calories:
          type: number
        is_default:
          type: boolean
      required:
      - id
      - food_id
      - label
      - calories
      - is_default
    food_entries:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        log_date:
          type: string
          format: date
        meal:
          type: string
        food_id:
          type: string
          format: uuid
        food_name_snapshot:
          type: string
        portion_label:
          type: string
        quantity:
          type: number
        calories:
          type: number
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - log_date
      - meal
      - food_name_snapshot
      - portion_label
      - quantity
      - calories
      - created_at
    email_tokens:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        type:
          type: string
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - type
      - expires_at
    sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - expires_at
